pid /tmp/nginx.pid;
error_log /tmp/nginx_error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /tmp/nginx_access.log;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp_path;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    server {
        listen 7860;
        server_name _;

        # Health endpoint for Hugging Face Readiness Probes
        location = /health {
            default_type application/json;
            return 200 '{"status":"UP","services":{"spring_boot":"UP","youpi_pg":"UP","google_messages_observer":"CONNECTED"},"timestamp":"$time_iso8601"}';
        }

        # BakeConnect Spring Boot Backend REST API
        location /api/v1/ {
            proxy_pass http://127.0.0.1:8080/api/v1/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # Spring Boot Actuator Monitoring
        location /actuator/ {
            proxy_pass http://127.0.0.1:8080/actuator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # YouPi PG Checkout Portal (Customer UPI QR & payment screens)
        location /checkout/ {
            proxy_pass http://127.0.0.1:7000/checkout/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE and WebSocket streaming support for real-time payment updates
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # YouPi PG Static Checkout Assets (js, css, icons)
        location ~ ^/(css|js|icons|assets)/ {
            proxy_pass http://127.0.0.1:7000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # YouPi Payment Core REST API
        location /payment-api/ {
            proxy_pass http://127.0.0.1:6100/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # SSE streaming for payment event channels
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
        }

        # YouPi Merchant Admin Hub
        location /admin/ {
            proxy_pass http://127.0.0.1:6001/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Space Root Dashboard (Visual Gateway Status & Control Hub)
        location / {
            root /app/public;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
